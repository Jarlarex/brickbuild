[project]
name = "brickbuild"
version = "0.1.0"
description = "Turn a 3D mesh (and later, photos) into a buildable brick model with instructions and a parts list."
readme = "README.md"
authors = [
    { name = "Jarlarex", email = "jarla1335@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "trimesh>=5.1.1",
    "typer>=0.27.3",
]

[project.scripts]
brickbuild = "brickbuild.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
